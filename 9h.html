<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9h</title>
    <style>
      .googlelogo {
        width: 200px;
      }
      .googleinput {
        width: 600px;
        border-radius: 100px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 8px;
        margin-bottom: 30px;

        border: none;
        box-shadow: 0 0 8px 2px rgba(0, 0, 0, 0.15);
        box-shadow: 5px 5px 10px gray;
      }
      div {
        text-align: center;
      }
      button {
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 6px;
        padding-bottom: 6px;
        border: none;
      }
      .lucky {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div><img class="googlelogo" src="google.png" alt="" /></div>
    <div>
      <input
        class="googleinput"
        placeholder="Search Google or type a URL"
        type="text"
      />
    </div>
    <div>
      <button class="search">Google Search</button>
      <button class="lucky">I'm Feeling Lucky</button>
    </div>
  </body>
</html>
