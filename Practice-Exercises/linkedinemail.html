<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Email Example</title>
    <style>
      .link-button {
        background-color: rgb(56, 78, 201);
        border: none;
        padding-left: 100px;
        padding-right: 100px;
        padding-top: 5px;
        padding-bottom: 5px;
        border-radius: 50px;
        color: white;
      }
      .email {
        font-size: 12px;
        color: gray;
      }
      .agreement {
        font-size: 12px;
        color: gray;
      }
      .input-enter {
        width: 270px;
        border-color: black;
        border-width: 1px;
      }
      p {
        font-family: Arial;
      }
    </style>
  </head>
  <body>
    <p class="email">Email</p>
    <input class="input-enter" type="text" />
    <p class="agreement">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>
    <button class="link-button">Agree & Join</button>
  </body>
</html>
