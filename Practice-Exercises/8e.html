<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8e</title>
    <style>

        font-family: Arial;

  <body>
    <p>Request a ride now</p>
    <input
      class="pickup"
      placeholder="Enter pickup location"

      class="dest"

    <button class="sched">Schedule for later</button>
