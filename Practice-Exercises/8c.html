<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8c</title>
    <style>
      .googlelogo {
        width: 200px;
        margin-left: 350px;
        display: block;
      }
      .googleinput {
        width: 600px;
        border-radius: 100px;
        padding-top: 8px;
        padding-bottom: 8px;

        margin-left: 150px;

      }

  <body>
    <img class="googlelogo" src="google.png" alt="" />
    <input
      class="googleinput"
      placeholder="Search Google or type a URL"
      type="text"
    />
