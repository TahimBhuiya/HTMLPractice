<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9e</title>
    <style>
      .pups {
        height: 50px;
        width: 50px;
        object-fit: cover;
        border-radius: 25px;
        vertical-align: middle;
      }
      .happ {
        border: none;
        vertical-align: middle;
        width: 300px;
      }
      .tweet-button {
        border: none;
        color: white;
        background-color: rgb(29, 155, 240);
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
        font-weight: bold;
        border-radius: 30px;
        vertical-align: middle;
      }
      .twitbox {
        width: 450px;
        box-shadow: 0 0 8px 2px rgba(0, 0, 0, 0.15);
        padding-left: 10px;
        border-radius: 10px;
        padding-top: 10px;
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="twitbox">
      <img class="pups" src="puppies.jpg" alt="" />
      <input class="happ" type="text" placeholder="What's happening?" />
      <button class="tweet-button">Tweet</button>
    </div>
  </body>
</html>
