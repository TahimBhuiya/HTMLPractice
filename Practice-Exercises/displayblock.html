<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Block example</title>
    <style>
      .name-input {
        display: block;
        margin-bottom: 10px;
      }
      .email-input {
        display: block;
      }
    </style>
  </head>
  <body>
    <input class="name-input" placeholder="Name" type="text" name="" id="" />
    <input class="email-input" placeholder="Email" type="text" name="" id="" />
  </body>
</html>
