<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter text box example</title>
    <style>
      .pups {
        height: 50px;
        width: 50px;
        object-fit: cover;
        border-radius: 25px;
        vertical-align: middle;
      }
      .happ {
        border: none;
        vertical-align: middle;
      }
      .tweet-button {
        border: none;
        color: white;
        background-color: rgb(29, 155, 240);
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
        font-weight: bold;
        border-radius: 30px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <img class="pups" src="puppies.jpg" alt="" />
    <input class="happ" type="text" placeholder="What's happening?" />
    <button class="tweet-button">Tweet</button>
  </body>
</html>
