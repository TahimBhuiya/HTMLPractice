<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9f</title>
    <style>
      .friend-div {
        width: 200px;
        box-shadow: 5px 5px 10px gray;
        display: inline-block;
        margin-right: 20px;
      }
      .animals {
        width: 200px;
        height: 200px;
        object-fit: cover;
      }
      p {
        font-family: Arial;
      }
      .name {
        font-weight: bold;
        margin-left: 8px;
        margin-bottom: 4px;
        font-size: 18px;
      }
      .mutual {
        color: gray;
        margin-left: 8px;
        font-size: 16px;
      }
      .add {
        background-color: rgb(24, 119, 242);
        color: white;
        border: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 4px;
        font-size: 16px;
        margin-left: 8px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="friend-div">
      <img class="animals" src="puppies.jpg" alt="" />
      <p class="name">Oliver</p>
      <p class="mutual">2 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
  </body>
</html>
