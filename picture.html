<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture example</title>
    <style>
      .dogs {
        width: 200px;
        height: 200px;
        object-position: center;
        object-fit: cover;
        border-radius: 100px;
      }
      .search {
        font-size: 16px;
        border: none;
        width: 500px;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 30px;
        margin-top: 20px;
        margin-bottom: 20px;
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <img class="dogs" src="puppies.jpg" alt="doggies" />
    <input
      class="search"
      placeholder="Search Google or type a URL"
      type="text"
      name=""
      id=""
    />
  </body>
</html>
